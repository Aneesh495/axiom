name: Python solver tools
on:
  push:
    paths: ['python/**', '.github/workflows/python-tools.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python-tools.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: python -m unittest discover -s python -p 'test_*.py' -v
